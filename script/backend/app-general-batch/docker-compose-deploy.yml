services:
  app:
    container_name: app-batch
    image: ghcr.io/acinus1001/oscsync-app-general-batch:latest
    env_file:
      - ${ENV_FILE_LOC}
    networks:
      - oscsync-infra
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  oscsync-infra:
    external: true