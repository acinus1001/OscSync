# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: app-discord-bot ci/cd

on:
  workflow_dispatch:
    inputs:
      do_build:
        description: execute build job
        type: boolean
        required: true
        default: true
      do_depoly:
        description: execute deploy job.
        type: boolean
        required: true
        default: true

jobs:
  build:
    if: ${{ inputs.do_build }}
    environment: APP_DISCORD_BOT
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Outside Dependency
        run: ./gradlew module:application:app-discord-bot:copyDependency

      - name: Build Plain Jar
        run: ./gradlew module:application:app-discord-bot:jar

      - name: Build and push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./script/backend/app-discord-bot/Dockerfile
          push: true
          tags: ghcr.io/acinus1001/oscsync-app-discord-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: always() && (needs.build.result == 'skipped' || needs.build.result == 'success') && inputs.do_depoly
    needs:
      - build
    environment: APP_DISCORD_BOT
    runs-on: [ self-hosted, macOS, ARM64 ]
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_FILE_LOC: "/Volumes/External0001/docker/app-discord-bot/docker-compose.yml"
      IMAGE_NAME: "ghcr.io/acinus1001/oscsync-app-discord-bot:latest"

    steps:
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | /usr/local/bin/docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy on Self-hosted Runner
        run: |
          echo "$COMPOSE_FILE_LOC"
          /usr/local/bin/docker pull "$IMAGE_NAME"
          /usr/local/bin/docker-compose -f "$COMPOSE_FILE_LOC" down
          /usr/local/bin/docker-compose -f "$COMPOSE_FILE_LOC" up -d

  dependency-submission:
    if: inputs.do_build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
